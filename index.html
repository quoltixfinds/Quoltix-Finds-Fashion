<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quoltix Finds - Fashion</title>
  <meta name="description" content="Quoltix Finds - Fashion is a curated discovery platform for fashion — browse by category and get pointed straight to the source." />
  <meta name="keywords" content="fashion inspiration, trending outfits, style ideas, curated fashion" />
  <meta name="author" content="Quoltix Finds - Fashion" />
  <meta name="robots" content="index, follow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quoltixfinds.github.io/Quoltix-Finds-Fashion/" />
  <meta property="og:title" content="Quoltix Finds - Fashion" />
  <meta property="og:description" content="Discover curated fashion at Quoltix Finds - Fashion browse by category and get pointed straight to the source." />
  <meta property="og:image" content="https://quoltixfinds.github.io/Quoltix-Finds-Fashion/Media/Logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Quoltix Finds - Fashion" />
  <meta property="twitter:description" content="Discover curated fashion at Quoltix Finds - Fashion browse by category and get pointed straight to the source." />
  <meta property="twitter:image" content="https://quoltixfinds.github.io/Quoltix-Finds-Fashion/Media/Logo.png" />

  <!-- Favicon (drop your Media/Logo.png back into the project root to use it) -->
  <link rel="icon" type="image/png" sizes="32x32" href="Media/Logo.png" />
  <link rel="apple-touch-icon" href="Media/Logo.png" />

  <script>
    // Applied before first paint so there's never a flash of the wrong theme.
    // Defaults to dark when no preference has been saved yet.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('quoltix-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-navbar"></div>

  <main id="app-content" class="app-content" role="main" aria-live="polite"></main>

  <div id="app-footer"></div>

  <noscript>
    <div style="padding:3rem;font-family:sans-serif;">
      Quoltix Finds - Fashion needs JavaScript enabled to browse our fashion picks. Please enable JavaScript to continue.
    </div>
  </noscript>

  <!-- Data sources -->
  <script src="js/data/siteConfig.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/data/products.js"></script>

  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/dataStore.js"></script>

  <!-- Reusable components -->
  <script src="js/components/loading.js"></script>
  <script src="js/components/marquee.js"></script>
  <script src="js/components/themeToggle.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/categoryCard.js"></script>
  <script src="js/components/searchBar.js"></script>
  <script src="js/components/productGrid.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>

  <!-- Pages -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/category.js"></script>
  <script src="js/pages/redirect.js"></script>
  <script src="js/pages/notFound.js"></script>

  <!-- Router + bootstrap -->
  <script src="js/core/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
